[project]
name = "trackflow-seeders"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "email-validator>=2.3.0",
  "fastapi>=0.141.1",
  "libpass[bcrypt]>=1.9.3",
  "passlib[bcrypt]>=1.7.4",
  "python-dotenv>=1.2.3",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "tinydb>=4.8.0",
  "uvicorn[standard]>=0.52.4",
]

[project.scripts]
seed = "services.api.seed:main"
