server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /index.html {
        # Only redirect explicit requests, not the internal directory index.
        if ($request_uri ~ ^/index\.html(?:\?|$)) {
            return 301 /$is_args$args;
        }
    }

    location = /application.html {
        return 301 /application/$is_args$args;
    }

    location = /application/index.html {
        if ($request_uri ~ ^/application/index\.html(?:\?|$)) {
            return 301 /application/$is_args$args;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
